id: claude-subagents
name: Claude Code Subagents
featureId: subagents
description: >
  Claude Code spawns subagents via the Agent tool (renamed from Task in
  v2.1.63) — isolated Claude sessions with their own context window,
  system prompt, tool restrictions, and permissions. Built-in subagent
  types: Explore (read-only, Haiku-powered codebase search), Plan
  (read-only research used during plan mode), general-purpose (full tool
  access), plus helpers statusline-setup and claude-code-guide. Subagents
  can run in parallel, optionally in their own git worktree
  (isolation: worktree). They cannot spawn other subagents. Subagents can
  also persist memory across sessions (memory: user|project|local) and
  preload skills via the skills frontmatter field. Custom subagent types
  are defined in .claude/agents/*.md (project) or ~/.claude/agents/*.md
  (user), bundled in plugins, deployed via managed settings, or passed
  inline with --agents JSON. Use --agent <name> to run the whole session
  as a subagent.
example: |
  # Custom subagent: .claude/agents/code-reviewer.md
  ---
  name: code-reviewer
  description: Reviews code for quality and best practices
  tools: Read, Glob, Grep
  model: sonnet
  memory: project
  ---

  You are a code reviewer. Analyze changes for quality, security, and
  best practices.

  # Spawning a subagent from conversation:
  "Use the code-reviewer subagent on the auth module"
  # or @-mention:
  @code-reviewer (agent) look at the auth changes

  # Run whole session as that agent:
  claude --agent code-reviewer

  # Built-in subagent types:
  # - Explore         — read-only, Haiku-powered, skips CLAUDE.md
  # - Plan            — read-only, used in plan mode, skips CLAUDE.md
  # - general-purpose — full tool access, inherits model
syntax: text
docUrl: https://docs.claude.com/en/docs/claude-code/sub-agents
userExtensible: true
extensibilityNote: 'Define custom subagent types in .claude/agents/*.md, bundle in plugins, deploy via managed settings, or pass via --agents JSON'
customExample: |
  # Custom subagent orchestration via a skill:
  # .claude/skills/parallel-review/SKILL.md
  ---
  name: parallel-review
  description: Run security and performance reviews in parallel
  ---

  1. Spawn two subagents in parallel:
     - Security reviewer: check for OWASP top 10 issues
     - Performance reviewer: check for N+1 queries, missing indexes
  2. Collect both results
  3. Present a unified report sorted by severity
