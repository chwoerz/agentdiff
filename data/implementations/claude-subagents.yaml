id: claude-subagents
name: Claude Code Subagents
featureId: subagents
description: >
  Claude Code spawns subagents via the Agent tool — isolated Claude sessions
  with their own context window. Built-in subagent types include Explore
  (read-only codebase search), general-purpose (full tool access), Plan
  (architecture), and claude-code-guide (help with Claude Code itself).
  Subagents can run in parallel, each in its own git worktree for file
  isolation. The parent agent controls planning and integration while
  specialists handle bounded tasks. Subagents cannot spawn other subagents.
  Custom subagent types can be defined in .claude/agents/*.md.
example: |
  # Spawning a subagent from a skill or conversation:
  Agent({
    description: "Review migration safety",
    subagent_type: "general-purpose",
    prompt: "Review migration 0042_user_schema.sql for safety...",
    isolation: "worktree"
  })

  # Parallel subagents (multiple Agent calls in one message):
  Agent({ description: "Run tests", prompt: "..." })
  Agent({ description: "Lint check", prompt: "..." })

  # Built-in subagent types:
  # - Explore: read-only, fast search (grep, glob, read)
  # - general-purpose: full tool access
  # - Plan: architecture and design
  # - claude-code-guide: help with Claude Code features
syntax: text
docUrl: https://docs.anthropic.com/en/docs/claude-code/sub-agents
userExtensible: true
extensibilityNote: "Skills can orchestrate custom subagent workflows; custom subagent types via Agent SDK"
customExample: |
  # Custom subagent orchestration via a skill:
  # .claude/skills/parallel-review.md
  ---
  name: parallel-review
  description: Run security and performance reviews in parallel
  ---

  1. Spawn two subagents in parallel:
     - Security reviewer: check for OWASP top 10 issues
     - Performance reviewer: check for N+1 queries, missing indexes
  2. Collect both results
  3. Present a unified report sorted by severity
