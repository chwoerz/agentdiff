id: claude-plugins
name: Claude Code Plugins
featureId: plugins
description: >
  Claude Code plugins bundle commands, skills, agents, hooks, and MCP servers
  into a distributable package. Plugins are installed from marketplaces via
  `/plugin install <name>@<marketplace>`, and marketplaces are managed with
  `/plugin marketplace add`. For local development, `--plugin-dir` loads a plugin
  from a directory. Plugins enable sharing custom configurations and
  capabilities across teams and projects.
example: |
  # Install from a registered marketplace:
  /plugin install plugin-dev@claude-code-marketplace

  # Add a custom marketplace:
  /plugin marketplace add my-team-marketplace https://example.com/marketplace.json

  # Local development:
  claude --plugin-dir /path/to/my-plugin

  # Plugin directory structure:
  # my-plugin/
  #   .claude-plugin/
  #     plugin.json          — Plugin manifest (required)
  #   commands/              — Slash commands (.md files)
  #   agents/                — Subagent definitions (.md files)
  #   skills/                — Agent skills (SKILL.md per subdir)
  #   hooks/
  #     hooks.json           — Event handler configuration
  #   .mcp.json              — MCP server definitions
  #   scripts/               — Helper scripts

  # plugin.json
  {
    "name": "my-team-plugin",
    "version": "1.0.0",
    "description": "Shared conventions for our team"
  }
syntax: json
docUrl: https://docs.claude.com/en/docs/claude-code/plugins
userExtensible: true
extensibilityNote: 'Author plugins bundling commands, agents, skills, hooks, and MCP servers; distribute via marketplaces'
customExample: |
  # Plugin directory structure:
  my-team-plugin/
    .claude-plugin/
      plugin.json          # Required manifest
    commands/
      deploy.md            # /deploy slash command
    agents/
      reviewer.md          # Custom subagent
    skills/
      code-review/
        SKILL.md           # Custom skill
    hooks/
      hooks.json           # Event handlers
    .mcp.json              # MCP server defs

  # Install for local dev:
  claude --plugin-dir ./my-team-plugin

  # Or distribute via marketplace:
  /plugin install my-team-plugin@my-team-marketplace
