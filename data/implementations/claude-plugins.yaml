id: claude-plugins
name: Claude Code Plugins
featureId: plugins
description: >
  Claude Code supports plugins via --plugin-dir (local directory) and
  --plugin-url (remote URL). Plugins bundle skills, MCP servers, and settings
  into a distributable package. This is a newer feature (May 2026+) that
  enables sharing custom configurations and capabilities across teams and
  projects.
example: |
  # Load a local plugin:
  claude --plugin-dir ./my-plugin

  # Load a remote plugin:
  claude --plugin-url https://example.com/plugin

  # Plugin directory structure:
  # my-plugin/
  #   plugin.json          — Plugin manifest
  #   skills/              — Skill markdown files
  #   settings.json        — Default settings
  #   mcp-servers.json     — MCP server configs

  # plugin.json
  {
    "name": "my-team-plugin",
    "version": "1.0.0",
    "description": "Shared conventions for our team",
    "skills": ["skills/*.md"],
    "mcpServers": "mcp-servers.json",
    "settings": "settings.json"
  }
syntax: json
docUrl: https://docs.anthropic.com/en/docs/claude-code/plugins
userExtensible: true
extensibilityNote: "Create plugins bundling skills, MCP servers, and settings"
customExample: |
  # Plugin directory structure:
  my-team-plugin/
    plugin.json          # Plugin manifest
    skills/
      code-review.md     # Custom skill
      deploy.md          # Custom skill
    mcp-servers/
      internal-api/      # Bundled MCP server
    settings.json        # Default settings
  
  # Install:
  claude --plugin-dir ./my-team-plugin
  # Or from URL:
  claude --plugin-url https://example.com/plugin
