id: opencode-builtin-tools
name: OpenCode Built-in Tools
featureId: tools
description: >
  OpenCode ships a set of built-in tools with simple, unnamespaced names:
  bash (shell), edit (exact-string replacements), write (create/overwrite
  files), read (file contents with line ranges), grep (ripgrep-backed
  regex search), glob (file pattern matching), apply_patch (patch
  application), skill (load a SKILL.md), todowrite (task lists), webfetch
  (fetch a URL), websearch (Exa-backed web search, requires
  OPENCODE_ENABLE_EXA=1 or the OpenCode provider), question (ask the user),
  and lsp (experimental LSP code intelligence, requires
  OPENCODE_EXPERIMENTAL_LSP_TOOL=true). The implicit Task tool used to
  invoke subagents is gated by the `task` permission key. Tool behavior is
  controlled per-agent via the `permission` field.
example: |
  # OpenCode's built-in tools (simple, unnamespaced):
  # bash         — Execute shell commands
  # edit         — Modify files using exact string replacements
  # write        — Create new files or overwrite existing ones
  # read         — Read file contents (supports line ranges)
  # grep         — Search file contents (regex, ripgrep)
  # glob         — Find files by pattern matching
  # apply_patch  — Apply patch files
  # skill        — Load a SKILL.md into the conversation
  # todowrite    — Maintain a task list
  # webfetch     — Fetch and read web pages
  # websearch    — Search the web via Exa (OPENCODE_ENABLE_EXA=1)
  # question     — Ask the user a structured question
  # lsp          — LSP code intelligence (experimental, opt-in)
  #
  # Subagent invocation goes through the Task tool, gated by
  # the `task` permission key.

  # Tools are invoked automatically by the AI:
  User: "Fix the failing tests in auth.test.ts"

  # OpenCode:
  # 1. read  — reads the test file
  # 2. bash  — runs the test to capture the failure
  # 3. read  — reads the source under test
  # 4. edit  — applies a fix
  # 5. bash  — re-runs the tests to verify
syntax: text
docUrl: https://opencode.ai/docs/tools
userExtensible: true
extensibilityNote: 'Constrain tools per agent via `permission`; extend via custom tools and MCP servers'
