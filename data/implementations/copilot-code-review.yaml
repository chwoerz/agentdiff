id: copilot-code-review
name: Copilot Code Review
featureId: code-review
description: >
  GitHub Copilot can review pull requests on GitHub.com, review uncommitted
  changes in VS Code/Visual Studio/JetBrains/Xcode, and review changes from
  the Copilot CLI via the built-in `code-review` agent and `/review` slash
  command. On GitHub.com, add "Copilot" as a reviewer and Copilot leaves
  inline comments — often with one-click suggested changes. Copilot always
  leaves a "Comment" review (never "Approve" or "Request changes"), so it
  does not count toward required approvals. When a comment has a suggestion,
  clicking "Implement suggestion" drafts a request to the Copilot cloud
  agent, which opens a new PR applying the fix. Customizable via
  `.github/copilot-instructions.md` and
  `.github/instructions/**/*.instructions.md` (first 4000 chars only).
example: |
  # GitHub.com PR:
  # 1. Open the PR → Reviewers menu → select "Copilot"
  # 2. Wait ~30s for inline review comments
  # 3. Apply suggested changes one-by-one or as a batch commit
  # 4. Click "Implement suggestion" to dispatch the cloud agent
  #    to address feedback in a new PR

  # GitHub CLI:
  gh pr create --reviewer @copilot
  gh pr edit 42 --add-reviewer @copilot

  # VS Code:
  # - Editor: select code → right-click → Generate Code → Review
  # - Source Control view → "Copilot Code Review - Uncommitted Changes"
  # Comments appear inline and in the Problems panel.

  # Copilot CLI:
  copilot
  > /review                           # review staged/PR changes
  > /agent code-review                # invoke built-in code-review agent

  # Re-request review after pushing changes:
  # Click the sync icon next to "Copilot" in the Reviewers menu.

  # Custom review instructions (.github/copilot-instructions.md):
  # "When performing a code review, focus on readability and
  #  avoid nested ternary operators."
syntax: text
docUrl: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review
userExtensible: true
extensibilityNote: 'Customize with repository custom instructions; enable automatic review per repo/org'
