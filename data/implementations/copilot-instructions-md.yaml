id: copilot-instructions-md
name: .github/copilot-instructions.md
featureId: instructions
description: >
  Repository-level always-on instructions. VS Code automatically detects
  `.github/copilot-instructions.md` at the workspace root and includes it
  as context in every chat / agent request. Markdown body only — no
  frontmatter is required. VS Code also recognizes `AGENTS.md` and
  `CLAUDE.md` for cross-tool compatibility. Not used for inline code
  completions. Use Markdown links to reference other instruction files.
example: |
  # .github/copilot-instructions.md

  ## Code Style
  Use TypeScript with strict null checks enabled.
  Prefer `const` over `let`. Use arrow functions for callbacks.

  ## Testing
  Write Vitest tests for all new functions.
  Use `describe`/`it` blocks with clear test names.

  ## See also
  See [API conventions](./instructions/api-design.instructions.md).
syntax: markdown
docUrl: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
userExtensible: true
extensibilityNote: 'Create .github/copilot-instructions.md (or AGENTS.md / CLAUDE.md) for repo-wide always-on guidance'
