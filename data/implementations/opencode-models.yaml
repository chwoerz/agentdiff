id: opencode-models
name: OpenCode Models
featureId: model-selection
description: >
  OpenCode supports ~100 AI providers and models sourced from models.dev.
  The active model is set with the top-level `model` field as "provider/model-id";
  `small_model` configures a lighter model for tasks like summarization
  and compaction. Use `/models` in the TUI to switch mid-session. Local models
  via Ollama are fully supported for offline operation, and any
  OpenAI-compatible API endpoint can be configured as a custom provider
  under `provider.<name>.options`.
example: |
  # Switch model mid-session (interactive picker):
  /models

  // opencode.json — primary + small model:
  {
    "$schema": "https://opencode.ai/config.json",
    "model": "anthropic/claude-sonnet-4-6",
    "small_model": "anthropic/claude-haiku-4-5",
    "provider": {
      "anthropic": {
        "options": { "apiKey": "${ANTHROPIC_API_KEY}" }
      }
    }
  }

  // Local models via Ollama (OpenAI-compatible endpoint):
  {
    "$schema": "https://opencode.ai/config.json",
    "model": "ollama/deepseek-coder-v2:latest",
    "provider": {
      "ollama": {
        "options": { "baseURL": "http://localhost:11434/v1" }
      }
    }
  }
syntax: json
docUrl: https://opencode.ai/docs/models
userExtensible: true
extensibilityNote: '~100 providers from models.dev; any OpenAI-compatible endpoint works via provider.<name>.options'
customExample: |
  // opencode.json
  {
    "$schema": "https://opencode.ai/config.json",
    "model": "anthropic/claude-sonnet-4-6",
    "small_model": "custom-local/llama3.2:70b",
    "provider": {
      "anthropic": {
        "options": { "apiKey": "${ANTHROPIC_API_KEY}" }
      },
      "custom-local": {
        "options": { "baseURL": "http://localhost:11434/v1" }
      }
    }
  }
