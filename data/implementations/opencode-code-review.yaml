id: opencode-code-review
name: OpenCode Code Review
featureId: code-review
description: >
  OpenCode does not have a dedicated code review feature. Users can ask the
  agent to analyze diffs, review changes, or examine specific files for
  issues. The agent uses its standard tools (file:read, shell:exec for git
  diff, lsp:diagnostics) to provide review-like feedback. No structured
  review workflow or PR integration exists.
example: |
  # No dedicated review command — use natural language:

  "Review the changes I've made since the last commit"
  # Agent runs: git diff HEAD
  # Reads changed files for context
  # Provides feedback on issues found

  "Check src/auth/ for security issues"
  # Agent reads files in the directory
  # Uses LSP diagnostics for type errors
  # Analyzes code for common security patterns

  "Compare this branch against main"
  # Agent runs: git diff main...HEAD
  # Summarizes changes and identifies concerns

  # No PR integration or inline commenting
  # No structured review output format
  # Relies on agent's general analysis capabilities
syntax: text
docUrl: https://opencode.ai/docs
userExtensible: false
extensibilityNote: "No dedicated review; uses standard tools for review-like feedback"
