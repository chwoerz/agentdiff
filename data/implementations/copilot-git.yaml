id: copilot-git
name: Copilot Git & GitHub Integration
featureId: git-integration
description: >
  GitHub Copilot has tight GitHub integration. Copilot cloud agent (formerly
  "coding agent") can be assigned issues by setting "Copilot" as the assignee,
  works in an ephemeral GitHub Actions runner, creates a branch, makes commits,
  and opens a draft pull request. Mention `@copilot` in a PR comment to ask
  it to iterate. In VS Code, Copilot can generate commit messages and PR
  titles/descriptions, and the `@github` chat participant answers questions
  about issues and pull requests. The GitHub CLI extension `gh copilot suggest`
  generates shell commands.
example: |
  # 1. Cloud agent: assign an issue to Copilot on GitHub.com
  #    (Assignees dropdown → "Copilot"). Copilot then:
  #    - Creates a branch (e.g. copilot/<issue>)
  #    - Works in a GitHub Actions runner
  #    - Opens a draft PR when ready
  #    - Iterates when @copilot is mentioned in PR comments

  # 2. Ask the cloud agent to iterate on an open PR:
  @copilot please address the review comments

  # 3. In VS Code:
  #    - Source Control view → sparkle icon → "Generate Commit Message"
  #    - "Generate Pull Request Title and Description" in the PR view
  #    - #changes attaches uncommitted changes to a chat prompt
  #    - @github participant answers PR/issue questions:
  @github What are the open PRs assigned to me?

  # 4. GitHub CLI extension:
  gh extension install github/gh-copilot
  gh copilot suggest "revert the last merge commit"
  gh copilot explain "git rebase -i HEAD~3"

  # 5. Request a Copilot code review via CLI:
  gh pr create --reviewer @copilot
syntax: text
docUrl: https://docs.github.com/en/copilot/concepts/coding-agent/coding-agent
userExtensible: false
extensibilityNote: 'Extend cloud agent via custom instructions, MCP servers, custom agents, hooks, and skills'
