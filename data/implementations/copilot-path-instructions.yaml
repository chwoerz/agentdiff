id: copilot-path-instructions
name: '.instructions.md (applyTo)'
featureId: instructions
description: >
  Path-scoped instruction files. `*.instructions.md` files live in
  `.github/instructions/` (workspace) or `~/.copilot/instructions/` (user);
  VS Code searches subfolders recursively, and the Copilot CLI loads the
  same files (use `/instructions` to view/toggle them). Optional YAML
  frontmatter: `name`, `description`, `applyTo` (glob, relative to
  workspace root). Files with an `applyTo` pattern are applied
  automatically when the agent works on matching files; without `applyTo`
  they are not auto-applied but can still be attached manually to a chat
  request. Multiple instruction files combine (no guaranteed order).
  Claude-format rules in `.claude/rules` use a `paths` array instead of
  `applyTo`.
example: |
  # .github/instructions/typescript.instructions.md
  ---
  description: TypeScript & React conventions
  applyTo: "**/*.ts,**/*.tsx"
  ---

  Use strict TypeScript. Prefer interfaces over types.
  Always use explicit return types on exported functions.

  # .github/instructions/api-routes.instructions.md
  ---
  applyTo: "src/api/**"
  ---

  All route handlers must validate input with zod.
  Return RFC 7807 problem details for errors.
  Always include rate limiting middleware.

  # .github/instructions/tests.instructions.md
  ---
  applyTo: "**/*.test.ts,**/*.spec.ts"
  ---

  Use vitest. Prefer integration tests over unit tests.
  Never mock the database — use test containers.
syntax: markdown
docUrl: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
userExtensible: true
extensibilityNote: 'Create `.instructions.md` files under `.github/instructions/` with `applyTo` glob patterns'
