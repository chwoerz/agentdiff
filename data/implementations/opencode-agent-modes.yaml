id: opencode-agent-modes
name: OpenCode Agent Modes
featureId: agent-modes
description: >
  OpenCode supports two built-in primary agents that you toggle with the
  Tab key: Build (default, full tool access for development work) and
  Plan (restricted — `edit` and `bash` default to ask). Built-in
  subagents are General (full tool access for multi-step tasks),
  Explore (fast read-only codebase search), and Scout (read-only
  external docs and dependency research) — all three ship enabled.
  Hidden system agents (compaction, title, summary) run automatically.
  Custom agents are declared with `mode: primary | subagent | all` and
  can be defined inline in opencode.json or as Markdown files in
  `.opencode/agents/` (project) or `~/.config/opencode/agents/` (global).
example: |
  # Toggle primary agent (Tab key):
  # build — default, all tools enabled for development
  # plan  — `edit` and `bash` default to ask

  # Sub-agents (used internally or via @-mention):
  # general — full tool access, multi-step task execution
  # explore — read-only, fast codebase search
  # scout   — read-only external docs / dependency research

  # The main agent delegates to sub-agents automatically,
  # or you can invoke explicitly: @explore find UserService usages

  # Override a built-in by redefining it in opencode.json:
  {
    "$schema": "https://opencode.ai/config.json",
    "agent": {
      "build": {
        "mode": "primary",
        "model": "anthropic/claude-sonnet-4-6",
        "permission": { "edit": "allow", "bash": "allow" }
      }
    }
  }
syntax: bash
docUrl: https://opencode.ai/docs/agents
userExtensible: true
extensibilityNote: 'Custom agents inline in opencode.json (`agent`) or as Markdown files in .opencode/agents/ (or ~/.config/opencode/agents/)'
customExample: |
  # .opencode/agents/reviewer.md
  ---
  description: Reviews code for quality and best practices
  mode: subagent
  model: anthropic/claude-sonnet-4-6
  temperature: 0.1
  permission:
    edit: deny
    bash: deny
  ---

  You are in code review mode. Focus on:

  - Code quality and best practices
  - Potential bugs and edge cases
  - Performance implications
  - Security considerations

  Provide constructive feedback without making direct changes.
