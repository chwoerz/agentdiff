id: copilot-extensions
name: Copilot Extensions
featureId: plugins
description: >
  Copilot Extensions are third-party integrations built as GitHub Apps or
  VS Code chat participant extensions. In VS Code/JetBrains chat they are
  invoked via @-mention (e.g. @docker, @azure, @github) and surface
  domain-specific tools, skills, and context. They are distinct from custom
  agents (`.agent.md` files), which are user/team-defined personas selected
  from the agents dropdown. For programmatic tool integration, prefer MCP
  servers; for in-IDE chat participants and marketplace distribution, use
  Copilot Extensions.
example: |
  # Marketplace extensions in chat (VS Code/JetBrains @-mentions):
  @docker Optimize my Dockerfile for production
  @azure Deploy this app to Azure Container Apps
  @github Summarize the open PRs on this repo

  # Discover/install:
  # - VS Code: Extensions view → search for Copilot chat participants
  # - GitHub Marketplace → Copilot Extensions category
  # - GitHub Apps you install can also register as Copilot Extensions

  # Build your own Copilot Extension:
  # - Implement the Copilot Extensions API (GitHub App backend), or
  # - Contribute a chat participant from a VS Code extension.
syntax: text
docUrl: https://docs.github.com/en/copilot/concepts/build-copilot-extensions/about-building-copilot-extensions
userExtensible: true
extensibilityNote: 'Install from the marketplace, or build your own as a GitHub App / VS Code chat participant'
customExample: |
  # Example: invoking an installed marketplace extension in chat:
  @docker Why is my container exiting with code 137?
  @sentry Show the most recent unresolved errors for service api
