id: claude-code-review
name: Claude Code Review
featureId: code-review
description: >
  Claude Code provides `/review` for code review of the current branch and
  `/security-review` for security-focused analysis. A deeper `/ultrareview`
  skill (also runnable non-interactively as `claude ultrareview [target]`,
  with `--json` and `--timeout` flags) orchestrates multi-agent review.
  Reviews use a code-reviewer subagent that gathers full context (reading
  related files and spawning Explore subagents) before providing feedback.
  Reviews can target specific files, commits, or the entire branch diff.
  Additional review workflows are available as community plugins/skills.
example: |
  # Single-agent review of current changes:
  /review

  # Security-focused review:
  /security-review

  # Deep multi-agent review (interactive):
  /ultrareview

  # Non-interactive (CI-friendly), prints findings, exits 0/1:
  claude ultrareview 1234 --json
  claude ultrareview --timeout 45

  # Review specific PR:
  "Review PR #42 and leave comments"

  # Claude Code review workflow:
  # 1. Gathers diff (git diff main...HEAD)
  # 2. Reads changed files for full context
  # 3. Spawns Explore subagents for related code
  # 4. Analyzes for bugs, style, security, performance
  # 5. Provides structured feedback with file:line references

  # Review output includes:
  # - Critical issues (bugs, security)
  # - Suggestions (style, performance)
  # - Questions (unclear intent)
syntax: text
docUrl: https://docs.claude.com/en/docs/claude-code/review
userExtensible: true
extensibilityNote: 'Built-in `/review`, `/security-review`, and `/ultrareview` (plus `claude ultrareview` CLI); add more review workflows via plugins and skills'
