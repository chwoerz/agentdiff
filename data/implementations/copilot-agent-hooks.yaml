id: copilot-agent-hooks
name: Copilot Hooks
featureId: hooks
description: >
  Shell commands triggered at agent lifecycle events. Configured as JSON files
  under `.github/hooks/` (workspace), `.claude/settings.json` (Claude format), or
  `~/.copilot/hooks` / `~/.claude/settings.json` (user). Available in VS Code
  (Preview), the Copilot CLI, and cloud agents. Supported events (PascalCase):
  `SessionStart`, `UserPromptSubmit`, `PreToolUse`, `PostToolUse`, `PreCompact`,
  `SubagentStart`, `SubagentStop`, `Stop`. Hooks can also be scoped to a custom
  agent via a `hooks` field in `.agent.md` frontmatter. Hooks receive JSON on
  stdin and can return JSON on stdout to influence behavior; exit code 2
  blocks the action.
example: |
  // .github/hooks/auto-format.json
  {
    "hooks": {
      "PostToolUse": [
        {
          "type": "command",
          "command": "npx prettier --write \"$TOOL_INPUT_FILE_PATH\"",
          "windows": "powershell -File scripts\\format.ps1",
          "timeout": 30
        }
      ],
      "PreToolUse": [
        {
          "type": "command",
          "command": "./scripts/validate-tool-call.sh",
          "timeout": 10
        }
      ]
    }
  }

  // Each entry: type ("command"), command (default), optional os overrides
  // (windows/linux/osx), cwd, env, timeout (seconds, default 30).
  // Hooks receive JSON on stdin (sessionId, hookEventName, tool_name, ...).
  // Return {"hookSpecificOutput": {"permissionDecision": "deny", ...}} to
  // block a single tool call; exit 2 also blocks.
syntax: json
docUrl: https://code.visualstudio.com/docs/copilot/customization/hooks
userExtensible: true
extensibilityNote: 'Create JSON files under `.github/hooks/` (or `~/.copilot/hooks`) with PascalCase event arrays'
