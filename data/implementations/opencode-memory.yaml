id: opencode-memory
name: OpenCode Memory
featureId: memory
description: >
  OpenCode's persistent project memory is `AGENTS.md`, created with `/init`
  and auto-loaded each session. Additional instruction files can be
  declared via the `instructions` array in `opencode.json`. Sessions are
  persisted in a SQLite database, so you can resume previous
  conversations. Within a single run, OpenCode supports multiple
  concurrent sessions so you can work on different tasks in parallel.
example: |
  # Create AGENTS.md from /init:
  /init

  # AGENTS.md (project root, committed to git)
  ## Project Context
  - This is a Go microservices project
  - Use table-driven tests
  - Follow the repository pattern for data access

  // Declare additional instruction files in opencode.json:
  {
    "$schema": "https://opencode.ai/config.json",
    "instructions": ["AGENTS.md", "docs/style.md"]
  }

  # Sessions persist in SQLite — resume from the session picker.
  # Concurrent sessions: work on different tasks in parallel within a single run.
syntax: text
docUrl: https://opencode.ai/docs
userExtensible: true
extensibilityNote: 'AGENTS.md plus the `instructions` array for additional persistent context'
