id: opencode-hooks
name: OpenCode Plugin Hooks
featureId: hooks
description: >
  OpenCode exposes ~20 lifecycle hooks via its JavaScript/TypeScript plugin
  system. Hook names use a mix of camelCase (`sessionCreated`, `messageCreated`,
  `toolExecuted`) and dot notation (`tool.execute.before`, `tool.execute.after`,
  `provider.update`, `model.update`, `permission.asked`, `chat.params`). Plugins
  return a `Hooks` object whose keys are hook names and whose values are
  async functions receiving the event payload.
example: |
  // my-plugin.ts
  import type { Plugin } from "@opencode-ai/plugin"

  const MyHooks: Plugin = async ({ $ }) => ({
    "tool.execute.before": async (input, output) => {
      // Mutate or veto the tool call before it runs
      if (input.tool === "read" && output.args.filePath.includes(".env")) {
        throw new Error("Do not read .env files")
      }
    },
    "tool.execute.after": async (input, output) => {
      if (input.tool === "write" || input.tool === "edit") {
        await $`npm run lint`
      }
    },
    async sessionCreated(session) {
      console.log(`Session ${session.id} started`)
    }
  })

  export default MyHooks

  // Selected hook events:
  // init
  // sessionCreated, messageCreated, toolExecuted, event, config
  // tool.execute.before, tool.execute.after
  // permission.asked, permission.replied
  // provider.update, model.update
  // chat.params
syntax: typescript
docUrl: https://opencode.ai/docs/plugins
userExtensible: true
extensibilityNote: 'Register hook handlers via JavaScript/TypeScript plugins (`default export`)'
customExample: |
  // plugins/lint-on-edit.ts
  import type { Plugin } from "@opencode-ai/plugin"

  const LintPlugin: Plugin = async ({ $ }) => ({
    "tool.execute.after": async (input) => {
      if ((input.tool === "edit" || input.tool === "write") &&
          input.args.filePath?.endsWith(".ts")) {
        await $`npx eslint --fix ${input.args.filePath}`
      }
    }
  })

  export default LintPlugin
