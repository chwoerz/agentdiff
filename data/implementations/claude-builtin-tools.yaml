id: claude-builtin-tools
name: Claude Code Built-in Tools
featureId: tools
description: >
  ~30 built-in tools invoked automatically. Core file/shell: `Read`, `Edit`, `Write`,
  `Bash`, `Glob`, `Grep`, `NotebookEdit`, `PowerShell`. Web: `WebSearch`, `WebFetch`.
  Planning/agents: `Agent`, `EnterPlanMode`, `ExitPlanMode`, `Skill`, `AskUserQuestion`.
  Task management (replaces deprecated `TodoWrite` as of v2.1.142): `TaskCreate`,
  `TaskGet`, `TaskList`, `TaskOutput`, `TaskStop`, `TaskUpdate`. Worktrees: `EnterWorktree`,
  `ExitWorktree`. Scheduling: `CronCreate`, `CronDelete`, `CronList`. Collaboration:
  `TeamCreate`, `TeamDelete`, `SendMessage`, `RemoteTrigger`, `PushNotification`, `Monitor`.
  MCP: `ListMcpResourcesTool`, `ReadMcpResourceTool`, `WaitForMcpServers`, `ToolSearch`.
  Misc: `LSP`, `ShareOnboardingGuide`. User approves or rejects each invocation.
example: |
  # Claude automatically uses tools during conversation:

  User: "Add error handling to the login function"

  # Claude invokes:
  # 1. Read tool — reads src/auth/login.ts
  # 2. Edit tool — wraps the body in try/catch
  # 3. Bash tool — runs `npm test` to verify
  # 4. Reports the result

  # Tools can be restricted in settings:
  # .claude/settings.json
  {
    "permissions": {
      "allow": ["Read", "Edit", "Write", "Bash(npm test:*)"],
      "deny": ["WebFetch", "Bash(rm:*)"]
    }
  }
syntax: json
docUrl: https://docs.claude.com/en/docs/claude-code/tools-reference
userExtensible: false
extensibilityNote: 'Built-in tools are fixed; extend via MCP servers, plugins, or skills for custom capabilities'
