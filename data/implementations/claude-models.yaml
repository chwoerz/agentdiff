id: claude-models
name: Claude Code Models
featureId: model-selection
description: >
  Claude Code supports Anthropic models only, addressed by the aliases
  `opus`, `sonnet`, and `haiku` which resolve to the latest corresponding
  model (currently Claude Opus 4.7, Claude Sonnet 4.6, Claude Haiku 4.5).
  Full Claude API IDs (e.g. `claude-opus-4-7`, `claude-sonnet-4-6`,
  `claude-haiku-4-5-20251001`, or legacy `claude-sonnet-4-5-20250929` /
  `claude-opus-4-5-20251101`) can also be pinned. Models can be selected
  via the `--model` CLI flag, the `/model` command in-session, `settings.json`
  (`modelOverrides`), or environment variables
  (`ANTHROPIC_DEFAULT_SONNET_MODEL` / `OPUS_MODEL` / `HAIKU_MODEL`).
example: |
  # Select model at startup with an alias:
  claude --model opus      # -> claude-opus-4-7
  claude --model sonnet    # -> claude-sonnet-4-6
  claude --model haiku     # -> claude-haiku-4-5

  # Or pin a specific version:
  claude --model claude-opus-4-7
  claude --model claude-sonnet-4-5-20250929   # legacy

  # Switch model mid-session:
  /model sonnet

  # Settings.json: pin alias resolution
  // ~/.claude/settings.json
  {
    "modelOverrides": {
      "sonnet": "claude-sonnet-4-6"
    }
  }

  # Environment variables override the alias resolution:
  export ANTHROPIC_DEFAULT_SONNET_MODEL=claude-sonnet-4-6
  export ANTHROPIC_DEFAULT_OPUS_MODEL=claude-opus-4-7
syntax: bash
docUrl: https://docs.claude.com/en/docs/claude-code/models
userExtensible: false
extensibilityNote: 'Anthropic models only; use aliases (opus/sonnet/haiku) or pin full model IDs'
