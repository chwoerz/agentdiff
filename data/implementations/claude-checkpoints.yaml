id: claude-checkpoints
name: Claude Code Checkpoints
featureId: checkpoints
description: >
  Automatic internal file-state snapshots created before each user prompt.
  Checkpoints persist across sessions (auto-cleaned with sessions after 30 days,
  configurable). Use the `/rewind` command or press Esc twice to open the rewind
  menu, where you can restore code, conversation, both, or summarize from/up to
  a chosen point. Checkpoints only track files modified by Claude's editing
  tools (`Edit`, `Write`, `NotebookEdit`) — not files changed by `Bash` commands or
  edits made outside the current session. Not a replacement for git.
example: |
  # Automatic checkpoints — no configuration needed

  # Open the rewind menu:
  /rewind
  # ...or press Esc + Esc

  # In the menu, choose:
  #   Restore code and conversation — revert both
  #   Restore conversation          — keep current code, rewind chat
  #   Restore code                  — revert files, keep conversation
  #   Summarize from here           — compress later messages
  #   Summarize up to here          — compress earlier messages

  # Limitations:
  # - Files modified by Bash (rm, mv, cp) are NOT tracked
  # - Manual edits outside the session are NOT captured
  # - Use git for permanent history; checkpoints are session-level undo
syntax: text
docUrl: https://docs.claude.com/en/docs/claude-code/checkpointing
userExtensible: false
extensibilityNote: 'Automatic; no custom configuration. Cleanup window is configurable via session retention settings.'
