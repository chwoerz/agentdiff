id: copilot-agent-modes
name: Copilot Agent Modes
featureId: agent-modes
description: >
  Copilot offers several agent surfaces. In VS Code chat, choose an agent
  from the agents dropdown — built-in options are `Agent` (multi-step edits
  and tool use), `Plan` (read-only research and planning), and `Ask` (Q&A).
  The Copilot CLI runs the same agent loop in the terminal with three
  modes cycled via `Shift+Tab` — standard (per-tool approval), plan
  (read-only), and autopilot (no approvals) — and per-tool control via
  `--allow-tool` / `--deny-tool` / `--allow-all-tools`. Copilot cloud agent
  (formerly "coding agent") runs autonomously on GitHub Actions runners —
  assign the "Copilot" user to an issue or mention `@copilot` in a PR
  comment, and it researches the repo, makes commits on a branch, and
  opens a draft PR. Third-party agents (Claude Agent preview, OpenAI
  Codex) can also run inside VS Code chat with your Copilot subscription.
example: |
  # VS Code: select agent from the agents dropdown in the chat view
  # Built-in: Agent | Plan | Ask
  # Plus: any .agent.md custom agents and third-party agents

  # Switch to agent mode shortcut:
  #   macOS  : ⇧⌘I
  #   Windows: Ctrl+Shift+I
  #   Linux  : Ctrl+Shift+Alt+I
  "Add input validation to the registration form"
  # Agent: searches codebase → edits files → runs tests → iterates

  # Plan mode (read-only): research and produce an implementation plan
  /plan refactor the auth module to use OAuth2

  # CLI modes (Shift+Tab cycles): standard → plan → autopilot
  copilot                                  # default: per-tool approval
  copilot --allow-all-tools                # autopilot: bypass approvals
  copilot --allow-tool shell --deny-tool 'shell(rm *)'

  # Cloud agent (GitHub.com):
  # 1. On an issue, set Assignees → "Copilot"
  # 2. Copilot creates a branch in a GitHub Actions runner,
  #    makes commits, opens a draft PR
  # 3. Iterate by mentioning @copilot in a PR comment
syntax: text
docUrl: https://code.visualstudio.com/docs/copilot/agents/overview
userExtensible: true
extensibilityNote: 'Create custom agents in `.github/agents/*.agent.md` (project) or `~/.copilot/agents` (user); selected from the agents dropdown'
customExample: |
  # .github/agents/security-reviewer.agent.md
  ---
  name: security-reviewer
  description: Reviews code for security vulnerabilities. Read-only.
  tools: [read, search]
  model: claude-sonnet-4.5
  ---

  You are a security expert. Analyze code for OWASP Top 10
  vulnerabilities, injection flaws, and authentication issues.
  Never modify files — only report findings with file:line references.

  # Usage: pick "security-reviewer" from the agents dropdown,
  # then send your prompt.
