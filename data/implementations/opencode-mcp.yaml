id: opencode-mcp
name: OpenCode MCP Servers
featureId: mcp-servers
description: >
  Configured in `opencode.json` under the top-level `mcp` object, where each
  key is the server name. Each server has a `type` of `"local"` (with a
  `command` array) or `"remote"` (with a `url` and optional `headers`).
  Supports `enabled`, `env`, and other per-server options.
example: |
  // opencode.json
  {
    "$schema": "https://opencode.ai/config.json",
    "mcp": {
      "playwright": {
        "type": "local",
        "command": ["npx", "-y", "@playwright/mcp"],
        "enabled": true,
        "env": { "BROWSER": "chromium" }
      },
      "github": {
        "type": "remote",
        "url": "https://api.githubcopilot.com/mcp/",
        "enabled": true,
        "headers": { "Authorization": "Bearer ${GITHUB_TOKEN}" }
      },
      "disabled-server": { "enabled": false }
    }
  }
syntax: json
docUrl: https://opencode.ai/docs/mcp-servers
userExtensible: true
extensibilityNote: 'Add MCP servers in `opencode.json` under the top-level `mcp` object'
