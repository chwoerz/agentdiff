id: opencode-subagents
name: OpenCode Subagents
featureId: subagents
description: >
  OpenCode ships three built-in subagents: General (full tool access for
  multi-step tasks), Explore (fast read-only codebase search), and Scout
  (read-only external docs and dependency research, including cloning
  dependency repos into OpenCode's managed cache). All three are enabled
  by default. Subagents are invoked by @-mentioning them in messages or
  automatically by the primary agent via the Task tool. Custom agents
  can be defined inline in opencode.json, as Markdown files in
  `.opencode/agents/` (project) or `~/.config/opencode/agents/` (global),
  or via the plugin system.
example: |
  # Invoke a subagent by @-mention:
  @explore Find all files that import the UserService class
  @general Search the repo and summarize the auth flow

  # Built-in subagent types:
  # - general  — full tool access, multi-step task execution
  # - explore  — read-only, fast codebase search
  # - scout    — read-only external docs / dependency research

  # Custom agent as a Markdown file:
  # .opencode/agents/reviewer.md
  # ---
  # description: Reviews PRs for style violations.
  # mode: subagent
  # model: anthropic/claude-sonnet-4-6
  # permission:
  #   edit: deny
  #   bash: ask
  # ---
  #
  # You are a strict PR reviewer. Focus on...
syntax: text
docUrl: https://opencode.ai/docs/agents
userExtensible: true
extensibilityNote: 'Define custom agents inline in opencode.json or as Markdown files in .opencode/agents/ (or ~/.config/opencode/agents/)'
customExample: |
  // opencode.json
  {
    "$schema": "https://opencode.ai/config.json",
    "agent": {
      "test-runner": {
        "description": "Runs and analyzes test results",
        "mode": "subagent",
        "model": "anthropic/claude-sonnet-4-6",
        "prompt": "You are a test specialist. Run tests, analyze failures, and suggest fixes.",
        "permission": { "edit": "deny" }
      }
    }
  }
