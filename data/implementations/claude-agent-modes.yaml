id: claude-agent-modes
name: Claude Code Agent Modes
featureId: agent-modes
description: >
  Claude Code offers permission modes controlling autonomy: `default` (asks
  before most actions), `acceptEdits` (auto-approves file edits), `plan`
  (read-only planning, no edits), `auto` (AI-based permission classifier,
  research preview), `dontAsk` (auto-denies tools unless pre-approved), and
  `bypassPermissions` (no confirmations, with circuit breakers for critical
  operations). Cycle modes mid-session with `Shift+Tab`. It supports
  subagent types including `Explore` (read-only context gathering, skips
  `CLAUDE.md`), `Plan` (read-only research used during plan mode), and
  `general-purpose` (full tool access). Custom subagent types can be
  defined in `.claude/agents/*.md`. Subagents can run in git worktree
  isolation for safe parallel execution.
example: |
  # Permission modes:
  claude                                    # default — asks before actions
  claude --permission-mode acceptEdits      # auto-approve file edits
  claude --permission-mode plan             # read-only planning
  claude --dangerously-skip-permissions     # bypassPermissions mode

  # In .claude/settings.json, set default mode:
  # "permissions": {
  #   "defaultMode": "default" | "acceptEdits" | "plan" |
  #                  "auto" | "dontAsk" | "bypassPermissions"
  # }

  # Built-in subagent types (used automatically by Claude):
  # Explore           — read-only, gathers context across codebase
  # general-purpose   — full tool access, executes subtasks

  # Worktree isolation for parallel work:
  # Claude creates git worktrees so subagents can edit
  # files without conflicting with each other or the
  # main workspace.

  # Example: Claude spawns 3 subagents in parallel:
  # Agent 1 (worktree): implements auth module
  # Agent 2 (worktree): writes tests
  # Agent 3 (worktree): updates documentation
syntax: bash
docUrl: https://docs.claude.com/en/docs/claude-code/agent-modes
userExtensible: true
extensibilityNote: 'Define custom subagent types in `.claude/agents/*.md` with YAML frontmatter'
customExample: |
  # .claude/agents/test-runner.md
  ---
  name: test-runner
  description: Runs tests and analyzes failures
  tools:
    - Bash
    - Read
  model: haiku
  ---

  You are a test specialist. Run the project's test suite,
  analyze any failures, and report results concisely.

  Always run the full suite before reporting partial results.

  # Usage — Claude auto-selects or you can specify:
  # Agent({ subagent_type: "test-runner", prompt: "Run all tests" })
