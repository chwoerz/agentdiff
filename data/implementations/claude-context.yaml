id: claude-context
name: Claude Code Context
featureId: context-providers
description: >
  Claude Code automatically gathers context from multiple sources: it reads
  CLAUDE.md files from the repo root and parent directories, indexes the
  repository structure, checks git status and recent commits, and uses grep
  and find to search the codebase on demand. It also spawns Explore subagents
  to gather context across large codebases in parallel. File contents are
  read on-demand rather than pre-indexed.
example: |
  # Context sources Claude Code uses automatically:

  # 1. CLAUDE.md files (loaded at session start)
  # 2. Git status and recent history
  git status
  git log --oneline -10

  # 3. Codebase search (invoked as needed)
  grep -r "UserService" src/ --include="*.ts"
  find src/ -name "*.test.ts"

  # 4. Explore subagent for broad context gathering
  # Claude spawns a subagent to read multiple files in parallel:
  # "Let me explore the authentication module to understand the patterns..."

  # 5. File reading on demand
  # Claude reads specific files when referenced or needed
syntax: bash
docUrl: https://docs.anthropic.com/en/docs/claude-code/context
userExtensible: true
extensibilityNote: "Extend context via CLAUDE.md files, MCP servers, and custom skills"
