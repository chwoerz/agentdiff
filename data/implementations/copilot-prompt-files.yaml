id: copilot-prompt-files
name: Copilot Prompt Files
featureId: skills
description: >
  Reusable prompt templates saved as `.prompt.md` files in `.github/prompts/`
  (workspace) or the VS Code user profile. Optional YAML frontmatter:
  description, name, argument-hint, agent (`ask` | `agent` | `plan` | custom
  agent name), model, tools. The body is Markdown and can use `${input:var}`
  placeholders and `#tool:<tool-name>` references. Invoked with `/name` in
  the chat input (or via "Chat: Run Prompt"). Agent Skills also surface as
  slash commands alongside prompt files. The Copilot CLI loads the same
  `.prompt.md` files from `.github/prompts/` and `~/.copilot/prompts/` and
  invokes them as `/name` slash commands; JetBrains and Visual Studio
  support a comparable prompt-file concept.
example: |
  # .github/prompts/create-component.prompt.md
  ---
  description: Scaffold a new React component with tests
  agent: agent
  model: Claude Sonnet 4.5
  tools: ['edit', 'search/codebase']
  ---

  Create a new React component named ${input:name:Component name}.

  Requirements:
  - TypeScript with proper prop types
  - Unit tests with Vitest
  - Follow patterns in src/components/
  - Add a Storybook story if storybook is configured

  Component type: ${input:type:functional or class component}

  # Invoke in chat:
  /create-component name=UserCard
syntax: markdown
docUrl: https://code.visualstudio.com/docs/copilot/customization/prompt-files
userExtensible: true
extensibilityNote: 'Create `.prompt.md` files under `.github/prompts/` or your user profile — invoked as `/commands` in chat'
customExample: |
  # .github/prompts/review-pr.prompt.md
  ---
  description: Review current changes for common issues
  agent: agent
  ---

  Review the staged changes and check for:

  1. Security issues (injection, XSS, secrets)
  2. Performance problems (N+1 queries, missing indexes)
  3. Missing error handling at system boundaries
  4. Test coverage for new code paths

  Format: list issues grouped by severity (critical, warning, suggestion).
