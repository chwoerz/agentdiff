id: opencode-plugins
name: OpenCode Plugins
featureId: plugins
description: >
  OpenCode has a JavaScript/TypeScript plugin system that allows extending
  the tool with custom tools, commands, and lifecycle hooks. Plugins are
  exported as default exports (or named functions) that receive a context
  object (project, client, $, directory, worktree) and return a Hooks
  object. Import types from "@opencode-ai/plugin". Plugins can hook into
  lifecycle events, intercept tool execution, customize providers/models,
  inject environment variables, and run side effects. Plugins are
  registered under the top-level `plugin` array in opencode.json
  (supports local paths, npm package specifiers, and tuple form with
  options).
example: |
  // my-plugin.ts
  import type { Plugin, PluginInput, Hooks } from "@opencode-ai/plugin"

  const myPlugin: Plugin = async (input: PluginInput): Promise<Hooks> => {
    const { client, project, directory, $ } = input

    return {
      async sessionCreated(session) {
        console.log(`New session: ${session.id}`)
      },
      "tool.execute.before": async (input, output) => {
        if (input.tool === "read" && output.args.filePath.includes(".env")) {
          throw new Error("Do not read .env files")
        }
      }
    }
  }

  export default myPlugin

  // opencode.json (note: key is `plugin`, singular):
  {
    "$schema": "https://opencode.ai/config.json",
    "plugin": [
      "./my-plugin.ts",
      "opencode-gemini-auth",
      "opencode-foo@1.2.3",
      ["opencode-bar", { "option": "value" }]
    ]
  }
syntax: typescript
docUrl: https://opencode.ai/docs/plugins
userExtensible: true
extensibilityNote: "Create JS/TS plugins; register them under the top-level `plugin` array in opencode.json"
customExample: |
  // opencode.json
  {
    "$schema": "https://opencode.ai/config.json",
    "plugin": ["./plugins/lint-on-save.ts"]
  }

  // plugins/lint-on-save.ts
  import type { Plugin } from "@opencode-ai/plugin"

  const LintPlugin: Plugin = async ({ $ }) => ({
    "tool.execute.after": async (input) => {
      if (input.tool === "edit" || input.tool === "write") {
        await $`npx eslint --fix ${input.args.filePath}`
      }
    }
  })

  export default LintPlugin
