id: claude-hooks
name: Claude Code Hooks
featureId: hooks
description: >
  Event-driven shell commands configured in settings.json. Hooks fire on
  tool calls (PreToolUse, PostToolUse), session lifecycle (PreCompact,
  SessionStart, Stop), and subagent events (SubagentStop). Each hook
  specifies a matcher and a command to run.
example: |
  // .claude/settings.json
  {
    "hooks": {
      "PreToolUse": [
        {
          "matcher": "Bash",
          "command": "echo 'About to run a shell command'"
        }
      ],
      "PostToolUse": [
        {
          "matcher": "Edit",
          "command": "npm run lint --fix $CLAUDE_FILE_PATH"
        }
      ],
      "Stop": [
        {
          "command": "say 'Claude is done'"
        }
      ]
    }
  }
syntax: json
docUrl: https://docs.anthropic.com/en/docs/claude-code/hooks
userExtensible: true
extensibilityNote: "Define custom hooks in .claude/settings.json for any lifecycle event"
