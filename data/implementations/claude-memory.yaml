id: claude-memory
name: Claude Code Memory
featureId: memory
description: >
  Claude Code's primary memory is the CLAUDE.md file: project memory at
  ./CLAUDE.md (and parent directories), and user memory at ~/.claude/CLAUDE.md.
  Both are auto-loaded into context every session. Agents additionally support
  a `memory` frontmatter field with three scopes: `user` (persists per-user
  across projects in ~/.claude/), `project` (shared project-level in .claude/),
  and `local` (per-user per-project in .claude/*.local.*). The AI can edit
  CLAUDE.md and agent memory files during conversations.
example: |
  # Project memory: ./CLAUDE.md (committed to repo)
  ## Architecture Notes
  - Frontend: Angular 21 with standalone components
  - Backend: Express with TypeScript
  - Database: PostgreSQL with Drizzle ORM

  ## Conventions
  - Use vitest, not jest
  - Functional style preferred over OOP
  - Concise commit messages (Conventional Commits)

  # User memory: ~/.claude/CLAUDE.md (personal, all projects)
  ## My Preferences
  - Always show me the diff before applying edits
  - Prefer pnpm over npm
syntax: markdown
docUrl: https://docs.claude.com/en/docs/claude-code/memory
userExtensible: true
extensibilityNote: "CLAUDE.md is user-editable; agents can use memory frontmatter for scoped persistence"
customExample: |
  # .claude/agents/test-reviewer.md
  ---
  name: test-reviewer
  description: Reviews test changes; remembers team conventions
  memory: project
  ---

  When reviewing tests, enforce:
  - Real database connections in integration tests (no mocks)
  - One assertion per test where practical
