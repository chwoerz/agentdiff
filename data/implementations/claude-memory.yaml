id: claude-memory
name: Claude Code Memory
featureId: memory
description: >
  Claude Code uses a file-based memory system stored in
  ~/.claude/projects/<project>/memory/. A MEMORY.md index tracks all memory
  entries. Memory types include user preferences, feedback from past sessions,
  project-specific context, and reference information. Memories persist across
  sessions and are automatically included in context. The AI can create, update,
  and reference memories during conversations.
example: |
  # Memory is stored in ~/.claude/projects/<project>/memory/

  # MEMORY.md — index of all memories
  # Individual memory files:

  # ~/.claude/projects/my-app/memory/user-preferences.md
  ## User Preferences
  - Prefers functional style over OOP
  - Uses vitest, not jest
  - Likes concise commit messages

  # ~/.claude/projects/my-app/memory/project-architecture.md
  ## Architecture Notes
  - Frontend: Angular 21 with standalone components
  - Backend: Express with TypeScript
  - Database: PostgreSQL with Drizzle ORM

  # Claude creates memories automatically:
  # "I'll remember that you prefer vitest for testing."
  # Memories are loaded into context each session.
syntax: markdown
docUrl: https://docs.anthropic.com/en/docs/claude-code/memory
userExtensible: true
extensibilityNote: "Memory files are user-readable and writable in ~/.claude/projects/"
customExample: |
  # ~/.claude/projects/my-project/memory/feedback_testing.md
  ---
  name: feedback-testing
  description: User prefers integration tests over mocks
  metadata:
    type: feedback
  ---
  
  Use real database connections in tests, not mocks.
  
  **Why:** Team got burned when mocked tests passed but prod migration failed.
  
  **How to apply:** For any test touching the database, use the test container setup.
