id: copilot-slash-commands
name: Copilot Built-in Slash Commands
featureId: skills
description: >
  GitHub Copilot Chat includes built-in slash commands for common workflows.
  The exact set varies by surface (VS Code, Visual Studio, JetBrains, Xcode,
  GitHub.com web chat, CLI). VS Code has the fullest set, including /explain,
  /fix, /tests, /new, /fixTestFailure, /help, and /clear. JetBrains supports a
  smaller subset. The Copilot CLI has its own slash commands (/model, /mcp,
  /compact, /context, /feedback, /allow-all, /yolo). Built-in chat commands are
  not user-extensible directly, but users can author custom commands via prompt
  files (.prompt.md) and skills (SKILL.md) in supported surfaces.
example: |
  # VS Code Copilot Chat built-in slash commands (verified):
  /clear           — Start a new chat session
  /explain         — Explain how the code in your active editor works
  /fix             — Propose a fix for problems in the selected code
  /fixTestFailure  — Find and fix a failing test
  /help            — Quick reference and basics of using GitHub Copilot
  /new             — Create a new project
  /tests           — Generate unit tests for the selected code

  # Visual Studio adds:
  /doc        — Add documentation comment for this symbol
  /optimize   — Analyze and improve running time of the selected code

  # JetBrains supports:
  /explain, /fix, /help, /tests

  # Xcode supports:
  /doc, /explain, /fix, /simplify, /tests

  # GitHub.com web chat:
  /clear, /delete, /new, /rename

  # Copilot CLI slash commands:
  /model, /mcp, /compact, /context, /feedback, /allow-all, /yolo

  # Usage:
  /tests Write vitest tests for the UserService class
syntax: text
docUrl: https://docs.github.com/en/copilot/reference/cheat-sheet
userExtensible: false
extensibilityNote: 'Built-in chat commands are predefined per surface; author custom commands via prompt files (.prompt.md) and SKILL.md skills where supported'
