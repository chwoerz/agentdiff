id: copilot-slash-commands
name: Copilot Built-in Slash Commands
featureId: skills
description: >
  GitHub Copilot includes built-in slash commands for common workflows.
  VS Code has the fullest set: /explain, /fix, /tests, /doc,
  /create-instructions, /new, /search, and /create-skill. JetBrains supports
  a subset. The CLI has its own commands via gh copilot suggest and explain.
  These built-in commands are not user-extensible, but users CAN create custom
  slash commands via Prompt Files (.prompt.md) and Agent Skills (SKILL.md).
example: |
  # VS Code Copilot Chat built-in slash commands:

  /explain    — Explain selected code or a concept
  /fix        — Suggest a fix for problems in selected code
  /tests      — Generate unit tests for selected code
  /doc        — Generate documentation for selected code
  /new        — Scaffold a new project or file
  /search     — Search the workspace for relevant code
  /skills     — List and manage agent skills
  /create-skill — AI-assisted skill creation

  # Usage in chat:
  /tests Write vitest tests for the UserService class

  # JetBrains supports:
  /explain, /fix, /tests, /doc

  # CLI:
  gh copilot suggest "undo last git commit"
  gh copilot explain "git rebase -i HEAD~3"
syntax: text
docUrl: https://docs.github.com/en/copilot/using-github-copilot/using-copilot-slash-commands
userExtensible: false
extensibilityNote: "Built-in commands are predefined; create custom commands via Prompt Files and Agent Skills instead"
