id: opencode-context
name: OpenCode Context
featureId: context-providers
description: >
  OpenCode gathers context through LSP integration (an experimental `lsp`
  tool that provides definitions, references, hover info and call
  hierarchy from configured language servers), file watching for real-time
  change detection, git operations executed via the `bash` tool, and
  agent-driven file reading where the AI reads files on demand using
  `read`, `grep`, and `glob`. The LSP tool must be enabled with
  `OPENCODE_EXPERIMENTAL_LSP_TOOL=true` and surfaces the same code
  intelligence developers see in their editors.
example: |
  # OpenCode context sources:

  # 1. LSP code intelligence — definitions, references, hover
  # Exposed via the experimental `lsp` tool
  # (OPENCODE_EXPERIMENTAL_LSP_TOOL=true)

  # 2. File watching — detects external changes
  # Files modified outside OpenCode are detected automatically

  # 3. Git status — surfaced via `bash` (e.g. git status)
  # Knows which files are modified, staged, untracked

  # 4. Agent-driven file reading
  # The AI reads files on demand using `read`
  # and searches with `grep` / `glob`

  # 5. AGENTS.md — persistent project instructions
  # Loaded from repo root and subdirectories
syntax: text
docUrl: https://opencode.ai/docs/context
userExtensible: true
extensibilityNote: 'LSP integration automatic; extend via `plugins` for custom context sources'
