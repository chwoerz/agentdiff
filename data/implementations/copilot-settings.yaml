id: copilot-settings
name: Copilot Settings
featureId: configuration
description: >
  GitHub Copilot is configured across multiple layers: VS Code `settings.json`
  for editor/chat behavior, JetBrains preferences for plugin settings,
  organization policies on GitHub.com for enterprise controls, and CLI
  configuration for the Copilot CLI. MCP servers are NOT configured in
  `settings.json` — they live in `.vscode/mcp.json` (workspace) or the user
  `mcp.json` file (see Copilot MCP). Common settings keys are documented in
  the VS Code Copilot settings reference.
example: |
  // VS Code settings.json — examples (not exhaustive)
  {
    // Enable/disable inline suggestions per language
    "github.copilot.enable": {
      "*": true,
      "plaintext": false,
      "markdown": true
    },

    // Chat / agent behavior
    "chat.checkpoints.enabled": true,
    "chat.agent.enabled": true,

    // Customization file discovery (defaults shown)
    "chat.promptFilesLocations": { ".github/prompts": true },
    "chat.instructionsFilesLocations": { ".github/instructions": true },
    "chat.agentFilesLocations": { ".github/agents": true },
    "chat.hookFilesLocations": {
      ".github/hooks": true,
      ".claude/settings.json": true
    }
  }

  // MCP servers live in .vscode/mcp.json or the user mcp.json — NOT here.

  # Organization policies (GitHub.com → Settings → Copilot):
  # - Enable/disable Copilot features per team
  # - Allow/block suggestions matching public code
  # - Content exclusion patterns
syntax: json
docUrl: https://code.visualstudio.com/docs/copilot/reference/copilot-settings
userExtensible: true
extensibilityNote: 'Configure via IDE settings, organization policies, and CLI config; MCP lives in `mcp.json`'
