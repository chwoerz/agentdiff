id: copilot-inline-completions
name: Copilot Inline Completions
featureId: ide-integration
description: >
  Real-time ghost text code suggestions that appear as you type. Copilot uses
  the current and open files in the editor for context. Press Tab to accept,
  Esc to dismiss, or Cmd/Ctrl+Right to accept the next word only. VS Code also
  offers Next Edit Suggestions (Copilot NES), which predicts the location and
  content of your next edit and lets you Tab through suggested edits across
  the file. Available in VS Code and JetBrains; this is Copilot's original
  feature.
example: |
  // Ghost text appears dimmed as you type:

  function calculateDiscount(price: number, percentage: number) {
    // Copilot suggests (ghost text):
    // return price * (percentage / 100);
    // Press Tab to accept
  }

  // Keyboard shortcuts (VS Code):
  // Tab                   — Accept suggestion / navigate to next edit suggestion
  // Esc                   — Dismiss
  // Cmd/Ctrl+Right        — Accept next word only
  // Hover suggestion      — Cycle through alternative suggestions

  // Next Edit Suggestions (Copilot NES):
  // Enable: github.copilot.nextEditSuggestions.enabled
  // A gutter arrow indicates the next predicted edit; press Tab
  // to navigate to it, Tab again to accept.

  // Comment-driven suggestions:
  // # write a recursive fibonacci function
  // (Copilot uses the comment as a hint for the next suggestion)
syntax: typescript
docUrl: https://code.visualstudio.com/docs/copilot/ai-powered-suggestions
userExtensible: false
extensibilityNote: "Built-in ghost text completions; choose completion model via 'GitHub Copilot: Change Completions Model' command"
