id: copilot-inline-completions
name: Copilot Inline Completions
featureId: ide-integration
description: >
  Real-time ghost text code suggestions that appear as you type. Copilot
  analyzes the current file, open tabs, and surrounding context to predict
  what you'll write next. Press Tab to accept a suggestion, Esc to dismiss,
  or Alt+] / Alt+[ to cycle through alternatives. Available in VS Code and
  JetBrains. This is Copilot's original and most widely-used feature.
example: |
  // As you type, Copilot shows ghost text (dimmed):

  function calculateDiscount(price: number, percentage: number) {
    // Copilot suggests (ghost text):
    // return price * (percentage / 100);
    // Press Tab to accept

  // After typing a function signature:
  function fibonacci(n: number): number {
    // Copilot suggests the full implementation:
    // if (n <= 1) return n;
    // return fibonacci(n - 1) + fibonacci(n - 2);

  // Keyboard shortcuts:
  // Tab        — Accept suggestion
  // Esc        — Dismiss
  // Alt+]      — Next suggestion
  // Alt+[      — Previous suggestion
  // Ctrl+→     — Accept next word only
syntax: typescript
docUrl: https://docs.github.com/en/copilot/using-github-copilot/getting-code-suggestions-in-your-ide
userExtensible: false
extensibilityNote: "Built-in ghost text completions; not user-configurable"
