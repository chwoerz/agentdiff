id: claude-skills
name: Claude Code Skills
featureId: skills
description: >
  Skills are markdown files (`SKILL.md`) with YAML frontmatter that extend
  Claude's capabilities. Discovered in `.claude/skills/<name>/` (project),
  `~/.claude/skills/<name>/` (user), plugins' `skills/` directories, and managed
  settings. Custom commands have been merged into skills: a file at
  `.claude/commands/foo.md` and a skill at `.claude/skills/foo/SKILL.md` both
  create `/foo`. Skills can be invoked manually with `/<skill-name>` or
  auto-loaded by Claude based on the description field. Claude Code ships
  bundled skills (`/simplify`, `/batch`, `/debug`, `/loop`, `/claude-api`). Skills
  follow the Agent Skills open standard and support supporting files,
  argument substitution (`$ARGUMENTS`, `$0`, `$1`), dynamic context injection
  (!`cmd`), running in a forked subagent (`context: fork`), preloaded into
  subagents, and per-skill hooks.
example: |
  # ~/.claude/skills/summarize-changes/SKILL.md
  ---
  description: Summarizes uncommitted changes and flags anything risky.
  allowed-tools: Bash(git *)
  ---

  ## Current changes

  !`git diff HEAD`

  ## Instructions

  Summarize the diff above in 2-3 bullets, then list any risks.

  # Invocation:
  /summarize-changes
  # or auto-triggered when user says "what changed?"

  # Skill paths:
  .claude/skills/<name>/SKILL.md         # project
  ~/.claude/skills/<name>/SKILL.md       # user
syntax: text
docUrl: https://docs.claude.com/en/docs/claude-code/skills
userExtensible: true
extensibilityNote: 'Create `SKILL.md` files in `.claude/skills/<name>/` subdirectories or bundle them in plugins'
