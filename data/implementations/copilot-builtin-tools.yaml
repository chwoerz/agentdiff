id: copilot-builtin-tools
name: Copilot Agent Mode Tools
featureId: tools
description: >
  In VS Code agent mode, Copilot has access to built-in tool sets that the
  model invokes as needed: `#read` (`readFile`, `problems`, `terminalLastCommand`,
  `terminalSelection`, notebook cell output), `#search` (`codebase`, `fileSearch`,
  `textSearch`, `listDirectory`, `usages`, `changes`, `githubRepo`, `githubTextSearch`),
  `#edit` (`createFile`, `createDirectory`, `editFiles`, `editNotebook`), `#execute`
  (`runInTerminal`, `getTerminalOutput`, `createAndRunTask`, `runNotebookCell`,
  `testFailure`), `#web` (`fetch`), `#agent` (`runSubagent`), and others like
  `#todos`, `#vscode/runCommand`, `#vscode/installExtension`. Tool calls require
  user approval by default; permission levels control this. JetBrains has a
  comparable subset. The Copilot CLI exposes an equivalent set through the
  same agent loop — shell execution, read/edit/create/delete on files,
  glob/grep search, web/fetch, agent (subagent delegation), todos, and MCP
  tools — gated by per-tool approval (`--allow-tool` / `--deny-tool` /
  `--allow-all-tools`) and the `Shift+Tab` mode (standard / plan / autopilot).
example: |
  # Agent mode example (VS Code):
  User: "Add a health check endpoint to the Express app"

  # The agent autonomously invokes built-in tools:
  # 1. #search/codebase     — find existing routes
  # 2. #read/readFile       — load src/app.ts
  # 3. #edit/createFile     — src/routes/health.ts
  # 4. #edit/editFiles      — register the route in app.ts
  # 5. #execute/runInTerminal — npm test
  # 6. #read/problems       — check for diagnostics
  # Each tool call surfaces an approval prompt unless auto-approved.

  # Reference a specific tool inline:
  #search/codebase find all error handlers
  #execute/runInTerminal npm run lint
  #web/fetch https://example.com/api  # summarize this page

  # Permission levels (per session):
  # Default Approvals | Bypass Approvals | Autopilot (Preview)
syntax: text
docUrl: https://code.visualstudio.com/docs/copilot/agents/agent-tools
userExtensible: true
extensibilityNote: 'Extend with MCP servers (`#`-tools from the server), VS Code chat tool extensions, or custom agents that restrict tools'
