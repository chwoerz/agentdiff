id: copilot-subagents
name: Copilot Custom Agents
featureId: subagents
description: >
  Custom agents are defined as `.agent.md` files with YAML frontmatter
  (description, name, tools, agents, model, user-invocable,
  disable-model-invocation, target, handoffs, hooks) and a Markdown body.
  Stored in `.github/agents/` (workspace), `.claude/agents/` (Claude format),
  or `~/.copilot/agents` (user). In VS Code chat they are selected from the
  agents dropdown (not via @-mention); in the Copilot CLI they are picked
  with `/agent`. An agent can delegate to other agents as subagents by
  including the `agent` tool plus an `agents:` list. The cloud Coding Agent
  runs autonomously in GitHub Actions and can be assigned issues directly.
example: |
  # .github/agents/security-reviewer.agent.md
  ---
  name: Security Reviewer
  description: Reviews code changes for security vulnerabilities
  tools: ['search/codebase', 'search/usages', 'web/fetch']
  model: Claude Sonnet 4.5
  ---

  You are a security specialist. Review changes for:
  - SQL injection and XSS vulnerabilities
  - Hardcoded secrets or credentials
  - Insecure deserialization
  - Missing input validation at system boundaries

  # In VS Code chat: pick "Security Reviewer" from the agents dropdown.
  # In the Copilot CLI: run `/agent` and select it.

  # Orchestration via subagents:
  # ---
  # name: Feature Builder
  # tools: ['agent']
  # agents: ['Researcher', 'Implementer']
  # ---
syntax: markdown
docUrl: https://code.visualstudio.com/docs/copilot/customization/custom-agents
userExtensible: true
extensibilityNote: 'Create .agent.md files in .github/agents/ (or .claude/agents/, ~/.copilot/agents) with scoped tools, model, and handoffs'
customExample: |
  # .github/agents/db-expert.agent.md
  ---
  name: DB Expert
  description: Specializes in SQL optimization and schema design
  tools: ['search/codebase', 'edit', 'run/terminal']
  ---

  You are a database expert. Focus on:
  - Query performance and EXPLAIN analysis
  - Indexing strategies
  - Schema normalization
  - Migration safety (lock duration, backfill strategies)

  When reviewing queries, always check for:
  1. Missing indexes on WHERE/JOIN columns
  2. N+1 query patterns
  3. Unbounded SELECT without LIMIT
