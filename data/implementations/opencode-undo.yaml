id: opencode-undo
name: OpenCode Undo/Redo
featureId: checkpoints
description: >
  OpenCode provides /undo and /redo commands for file-level change tracking.
  Each file modification made by the agent is tracked, and /undo reverts the
  last change. /redo re-applies an undone change. This provides a linear
  undo history for the current session. Changes are tracked at the file
  level, not at the individual edit level.
example: |
  # Undo the last file change:
  /undo
  # Reverts the most recent file modification
  # Output: Undid change to src/auth/login.ts

  # Redo an undone change:
  /redo
  # Re-applies the last undone modification
  # Output: Redid change to src/auth/login.ts

  # Undo multiple changes:
  /undo
  /undo
  /undo
  # Each /undo steps back one change

  # Limitations:
  # - File-level tracking (not line-level)
  # - Linear history (no branching undo)
  # - Session-only (lost after exit)
  # - Shell commands cannot be undone
syntax: text
docUrl: https://opencode.ai/docs/commands
userExtensible: false
extensibilityNote: "Built-in /undo and /redo for file-level tracking"
