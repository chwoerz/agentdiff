id: opencode-git
name: OpenCode Git Integration
featureId: git-integration
description: >
  OpenCode provides basic git integration through the `bash` tool, which
  the agent uses to run `git` commands. A small set of GitHub-aware CLI
  subcommands (`opencode github`, `opencode pr`) wrap workflows like
  creating PRs from a session, but there is no built-in inline PR review
  or CI/CD orchestration — the agent shells out to `gh` or `git` for
  anything beyond that. The agent also runs `git status` on demand to
  understand which files are modified or staged.
example: |
  # OpenCode uses git via the `bash` tool:

  # Basic operations:
  "Commit the changes with a descriptive message"
  # Agent runs: git add . && git commit -m "..."

  "Create a branch for this feature"
  # Agent runs: git checkout -b feat/new-feature

  "Show me what changed since yesterday"
  # Agent runs: git log --since=yesterday --oneline

  # GitHub workflows:
  # - `opencode github` — GitHub session integration
  # - `opencode pr`     — create / manage PRs from a session
  # - For anything else the agent shells out to `gh` (if installed)

  # Git status as context:
  # The agent runs `git status` on demand to understand
  # which files are modified and staged.
syntax: bash
docUrl: https://opencode.ai/docs
userExtensible: false
extensibilityNote: 'Git via `bash`; `opencode github`/`opencode pr` wrap basic GitHub workflows'
