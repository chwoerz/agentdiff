id: opencode-settings
name: OpenCode Settings
featureId: configuration
description: >
  OpenCode uses `opencode.json` (or `opencode.jsonc`) as its primary
  configuration file. Sources are merged in precedence order: remote
  (`.well-known/opencode`), global (`~/.config/opencode/opencode.json`),
  custom (`OPENCODE_CONFIG` env var), project (`opencode.json` in repo),
  `.opencode` directories (`agents/`, `commands/`, `plugins/`, etc.), inline
  (`OPENCODE_CONFIG_CONTENT` env var), file-based managed config, and
  macOS managed preferences (`.mobileconfig` via MDM, highest priority).
  TUI-only settings go in `tui.json`. Top-level fields include `model`,
  `small_model`, `default_agent`, `agent`, `command`, `instructions`, `provider`,
  `mcp`, `plugin`, `permission`, `tools`, `formatter`, `lsp`, `share`, `snapshot`,
  `autoupdate`, `compaction`, `watcher`, `shell`, `attachment`, `server`,
  `disabled_providers`, `enabled_providers`, and `experimental`. Variable
  substitution supports `{env:VAR}` and `{file:path}`.
example: |
  // opencode.json
  {
    "$schema": "https://opencode.ai/config.json",
    "model": "anthropic/claude-sonnet-4-6",
    "small_model": "anthropic/claude-haiku-4-5",
    "default_agent": "build",
    "instructions": ["AGENTS.md", "docs/style.md"],
    "provider": {
      "anthropic": {
        "options": { "apiKey": "{env:ANTHROPIC_API_KEY}" }
      }
    },
    "mcp": {
      "playwright": {
        "type": "local",
        "command": ["npx", "-y", "@playwright/mcp"],
        "enabled": true
      }
    },
    "plugin": ["./local-plugin.ts", "opencode-foo@1.2.3"],
    "permission": {
      "edit": "ask",
      "bash": { "git *": "allow", "*": "ask" }
    },
    "formatter": true,
    "lsp": true
  }
syntax: json
docUrl: https://opencode.ai/docs/config/
userExtensible: true
extensibilityNote: 'Edit `opencode.json` (project) or `~/.config/opencode/opencode.json` (global); TUI settings in `tui.json`; managed settings via MDM `.mobileconfig` on macOS'
