<div class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button
        (click)="sidebarOpen = !sidebarOpen"
        class="md:hidden p-1 text-gray-500 hover:text-gray-700"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <a routerLink="/" class="text-lg md:text-xl font-bold text-gray-900">
        AgentDiff
      </a>
    </div>
    <div class="flex items-center gap-4">
      <app-search />
      <nav class="hidden md:flex gap-4">
        <a routerLink="/compare" class="text-sm text-gray-600 hover:text-gray-900">
          Compare
        </a>
        <a routerLink="/matrix" class="text-sm text-gray-600 hover:text-gray-900">
          Matrix
        </a>
      </nav>
    </div>
  </header>
  <div class="flex flex-1">
    <div
      class="fixed inset-0 bg-black/30 z-40 md:hidden"
      [class.hidden]="!sidebarOpen"
      (click)="sidebarOpen = false"
    ></div>
    <div
      class="fixed z-50 md:relative md:z-auto transition-transform md:translate-x-0"
      [class.-translate-x-full]="!sidebarOpen"
      [class.translate-x-0]="sidebarOpen"
    >
      <app-feature-category-nav />
    </div>
    <main class="flex-1 p-4 md:p-6 overflow-x-hidden">
      <router-outlet />
    </main>
  </div>
</div>
